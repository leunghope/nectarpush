      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookUpdateRequest' }
            example: { status_only: true, enabled: false }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 更新成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEnvelope' }
              example: { success: true, message: Webhook 已更新, data: { id: 3, name: gh-star, link: 7c9f1d2e3b4a5f60718293a4b5c6d7e8, target_channel: my-ding, enabled: false, trigger_url: 'https://push.example.com/webhook/7c9f1d2e3b4a5f60718293a4b5c6d7e8', extract_rule: { repo: repository.full_name }, construct_rule: { title: '⭐ $repo' }, created_at: '2026-11-03T08:00:00Z' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
