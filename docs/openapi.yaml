      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: keyword, in: query, description: 按用户名/显示名搜索。, schema: { type: string, maxLength: 64 }, example: hop }
        - { name: include_deleted, in: query, description: 包含已注销（软删）用户，默认 false。, schema: { type: boolean, default: false } }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: 用户分页列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: 2
                      username: hope
                      display_name: Hope
                      role: user
                      status: active
                      email: hope@example.com
                      default_channel: email
                      permissions: { send_email_to_others: false, save_message: true }
