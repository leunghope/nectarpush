                data:
                  has_password: true
                  email_verification_enabled: false
                  email_change_requires_code: true
                  oauth:
                    bindings: [{ provider: github, display_name: GitHub, oauth_id: '1234567' }]
                    providers: [{ id: github, display_name: GitHub }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }

  /api/me/email/verification:
    post:
      tags: [me]
      operationId: sendEmailChangeCode
      summary: 发送修改邮箱的验证码
      description: 已配置 SMTP 时向新邮箱发送 6 位验证码，修改邮箱必须携带；未配置 SMTP 时返回 sent=false，邮箱仍可直接保存，但暂时无法用于找回密码。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
            example: { email: new@example.com }
      responses:
        '200':
          description: 发送结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeEnvelope' }
              example: { success: true, data: { sent: true, required: true, message: 验证码已发送 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/me/oauth/{provider}/start:
    get:
      tags: [me]
      operationId: startOAuthBind
      summary: 发起第三方账号绑定（302）
      description: 生成的 state 记录 bind 意图与当前用户 id；回调成功后跳转 `/me?oauth_bound=<provider>`。
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, maxLength: 32 }, example: github }
      responses:
        '302':
          description: 重定向到 Provider 授权页。
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/me/oauth/{provider}:
    delete:
      tags: [me]
      operationId: unbindOAuth
      summary: 解绑指定第三方账号（多绑）
      description: 按 provider 解绑单条绑定；账号尚无登录密码时拒绝解绑（422），避免把自己锁在门外；未绑定该 provider 返回 422。
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, maxLength: 32 }, example: github }
      responses:
        '200':
          description: 已解绑。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 已解绑第三方账号 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/events:
    get:
      tags: [realtime]
      operationId: subscribeEvents
      summary: SSE 事件流（登录用户）
      description: |
        `text/event-stream` 长连接。事件按登录用户隔离：`message.created` / `delivery.updated`
        仅推送本人消息的事件，不会跨用户泄露。事件类型（event 名）：
        - `message.created`：新消息写入数据库（负载 = MessageSummary）；
        - `delivery.updated`：投递明细状态变化（负载 = MessageDelivery）；
        - `heartbeat`：每 25 秒注释行保活。
        负载为 JSON（data 字段），结构同对应 schema。
      responses:
        '200':
          description: SSE 事件流。
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: message.created
                data: {"id":102,"uuid":"1a2b3c4d5e6f708192a3b4c5d6e7f809","title":"部署完成","channel_name":"my-tg","channel_type":"telegram","to":"@all","status":"async_pending","created_at":"2026-11-08T14:10:00Z"}

                event: delivery.updated
                data: {"id":9003,"message_id":102,"channel_id":1,"channel_name":"my-tg","status":"success","latency_ms":289,"error":null,"created_at":"2026-11-08T14:10:01Z"}

                : heartbeat
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/public/about:
    get:
      tags: [public]
      operationId: getAbout
      summary: 关于（公开）
      security: []
      responses:
        '200':
          description: 关于文本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextContentEnvelope' }
              example: { success: true, data: { content: '## 蜂鸟推送\n自托管的多渠道消息推送服务。' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/public/announcement:
    get:
      tags: [public]
      operationId: getAnnouncement
      summary: 公告（公开）
      security: []
      responses:
        '200':
          description: 公告文本（空内容返回空串）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextContentEnvelope' }
              example: { success: true, data: { content: '系统将于周日晚维护。' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/public/footer:
    get:
      tags: [public]
      operationId: getFooter
      summary: 页脚内容（公开）
      description: 站点页脚文本（管理员在系统设置 Footer 中配置），空内容返回空串。
      security: []
      responses:
        '200':
          description: 页脚文本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextContentEnvelope' }
              example: { success: true, data: { content: '© 2026 NectarPush · 自托管消息推送' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/public/turnstile-sitekey:
    get:
      tags: [public]
      operationId: getTurnstileSiteKey
      summary: Turnstile 人机验证站点密钥（公开）
      description: |
        登录/注册页引导 Turnstile 前端组件。仅返回开关与 SiteKey；
        TurnstileSecretKey 绝不出现在任何公开响应中。
      security: []
      responses:
        '200':
          description: Turnstile 站点配置。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnstileSiteKeyEnvelope' }
              example: { success: true, data: { enabled: true, site_key: 0x4AAAAAAA1234567890 } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/health:
    get:
      tags: [public]
      operationId: health
      summary: 健康检查（公开）
      security: []
      responses:
        '200':
          description: 存活探针。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
              example: { success: true, data: { status: ok, uptime_seconds: 86400, database: ok } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/version:
    get:
      tags: [public]
      operationId: version
      summary: 版本（公开）
      security: []
      responses:
        '200':
          description: 版本信息。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionEnvelope' }
              example: { success: true, data: { version: 1.0.0, commit: a1b2c3d } }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: np_session
      description: Web 控制台会话（登录后由服务端 Set-Cookie，HttpOnly）。
    bearerAuth:
      type: http
      scheme: bearer
      description: 用户全局推送令牌（`POST /api/me/token` 生成）；亦用于 `/push` 的 Authorization 头。
    pushTokenQuery:
      type: apiKey
      in: query
      name: token
      description: 推送令牌放 query 的形式（`/push/{username}?token=…`）。

  parameters:
    UsernamePath:
      name: username
      in: path
      required: true
      description: 目标用户名（唯一）。
      schema: { type: string, maxLength: 12 }
      example: hope
    IdPath:
      name: id
      in: path
      required: true
      description: 数值主键。
      schema: { type: integer, minimum: 1 }
      example: 1
    UuidPath:
      name: uuid
      in: path
      required: true
      description: 消息唯一 uuid（异步状态查询键）。
      schema: { type: string, minLength: 32, maxLength: 32 }
      example: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c
    Page:
      name: page
      in: query
      description: 页码（1 起）。
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数。
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      example: 10

  responses:
    BadRequest:
      description: 请求体不可解析（如空 body 或非法 JSON）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: 请求体格式错误, code: VALIDATION_FAILED }
    Unauthorized:
      description: 未登录 / 缺少或错误的推送令牌。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            tokenRequired:
              summary: 需要令牌
              value: { success: false, message: 通道维度或用户维度设置了鉴权令牌，需要提供鉴权令牌, code: TOKEN_REQUIRED }
            invalidToken:
              summary: 令牌错误
              value: { success: false, message: 无效的 token, code: INVALID_TOKEN }
            notLoggedIn:
              summary: 未登录
              value: { success: false, message: 未登录或会话已过期, code: UNAUTHORIZED }
    Forbidden:
      description: 已认证但无权（角色不足 / 资源禁用 / 开关关闭）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: 无权执行该操作, code: FORBIDDEN }
    PasswordChangeRequired:
      description: 会话处于强制改密状态（mustChangePassword=true），仅 PATCH /api/me 与 POST /api/auth/logout 放行。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: 请先修改密码, code: PASSWORD_CHANGE_REQUIRED }
    NotFound:
      description: 资源不存在（用户/通道/消息/Webhook 等）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            user:
              value: { success: false, message: 用户不存在, code: USER_NOT_FOUND }
            message:
              value: { success: false, message: 消息不存在, code: NOT_FOUND }
    ValidationError:
      description: 参数校验失败或依赖缺失。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: 异步发送消息需要用户具备消息持久化的权限, code: ASYNC_NOT_ALLOWED }
    RateLimited:
      description: 触发限流。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, message: 操作过于频繁，请稍后再试, code: RATE_LIMITED }
    UriTooLong:
      description: 路径参数长度超过 Fastify 路由 maxParamLength（默认 100）上限，由框架直接拒绝；属框架级保护，不是业务状态。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          example:
            error: Bad Request
            code: FST_ERR_MAX_PARAM_LENGTH
            message: 请求路径参数过长

  schemas:
    ErrorCode:
      type: string
      description: 统一错误码枚举。
      enum:
        - UNAUTHORIZED
        - TOKEN_REQUIRED
        - INVALID_TOKEN
        - FORBIDDEN
        - NOT_FOUND
        - USER_NOT_FOUND
        - USER_DISABLED
        - PASSWORD_CHANGE_REQUIRED
        - CHANNEL_NOT_FOUND
        - CHANNEL_DISABLED
        - CHANNEL_NAME_RESERVED
        - DUPLICATE_NAME
        - WEBHOOK_NOT_FOUND
        - WEBHOOK_DISABLED
        - VALIDATION_FAILED
        - ASYNC_NOT_ALLOWED
        - SMTP_NOT_CONFIGURED
        - CLIENT_NOT_CONNECTED
        - OAUTH_PROVIDER_NOT_CONFIGURED
        - OAUTH_ALREADY_BOUND
        - OAUTH_DISCOVERY_FAILED
        - DEPENDENCY_MISSING
        - RATE_LIMITED
        - INTERNAL_ERROR

    ErrorEnvelope:
      type: object
      description: 统一的失败响应格式。
      properties:
        success: { type: boolean, const: false }
        message: { type: string, description: 人类可读错误信息（简体中文）。 }
        code: { $ref: '#/components/schemas/ErrorCode' }
      required: [success, message]
      example: { success: false, message: 无效的 token, code: INVALID_TOKEN }

    SuccessEnvelope:
      type: object
      description: 统一的成功响应格式（无数据负载）。
      properties:
        success: { type: boolean, const: true }
        message: { type: string, example: 操作成功 }
      required: [success]

    PageMeta:
      type: object
      description: 分页元信息（Page&lt;T&gt; 的公共部分）。
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
      required: [page, page_size, total, total_pages]
      example: { page: 1, page_size: 10, total: 42, total_pages: 5 }

    RenderMode:
      type: string
      description: 渲染模式（缺省 markdown）。
      enum: [markdown, code, raw]
      example: markdown

    MessageStatus:
      type: string
      description: 消息状态（产品层枚举；群组按投递明细聚合）。
      enum: [pending, async_pending, success, partial, failed]
      example: success

    UserRole:
      type: string
      description: 角色（当前版本只有 user/admin/root 三级）。
      enum: [user, admin, root]
      example: user

    UserStatus:
      type: string
      enum: [active, disabled]
      example: active

    ChannelType:
      type: string
      description: 通道类型（16 类；QQ 通道为 one_bot，不用 one_api）。
      enum: [email, telegram, discord, ding, lark, bark, custom, client, group, none, test, corp_app, corp, lark_app, one_bot, tencent_alarm]
      example: telegram

    # ---------- 实体 ----------

    UserPermissions:
      type: object
      description: 用户授权位（管理员经 /api/users/{id}/manage 授予）。
      properties:
        send_email_to_others: { type: boolean, description: 允许邮件发往他人邮箱。 }
        save_message: { type: boolean, description: 允许消息持久化（async 前置条件）。 }
      required: [send_email_to_others, save_message]
      example: { send_email_to_others: false, save_message: true }

    User:
      type: object
      description: 用户实体（不含密码哈希与令牌明文）。
      properties:
        id: { type: integer }
        username: { type: string, maxLength: 12 }
        display_name: { type: string, maxLength: 20 }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        email: { type: [string, 'null'], format: email, maxLength: 50, description: 绑定邮箱；注销匿名化后为 null。 }
        default_channel: { type: [string, 'null'], maxLength: 20, description: 默认推送通道名。 }
        permissions: { $ref: '#/components/schemas/UserPermissions' }
        must_change_password: { type: boolean, description: 强制改密标志；为 true 时受保护接口返回 403 PASSWORD_CHANGE_REQUIRED。 }
        deleted_at: { type: [string, 'null'], format: date-time, description: 软删时间；未注销为 null。 }
        created_at: { type: string, format: date-time }
      required: [id, username, display_name, role, status, permissions, must_change_password, deleted_at, created_at]
      example:
        id: 2
        username: hope
        display_name: Hope
        role: user
        status: active
        email: hope@example.com
        default_channel: email
        permissions: { send_email_to_others: false, save_message: true }
        must_change_password: false
        deleted_at: null
        created_at: '2026-11-01T09:30:00Z'

    ChannelConfigPublic:
      type: object
      description: 通道配置（响应视图；敏感字段值一律替换为 `******`，未设置的字段不出现）。
      additionalProperties: { type: string, description: 配置键值（键见 config_schema.fields，如 secret/account_id/url/other）。 }
      example: { secret: '******', account_id: '123456789' }

    ChannelConfigInput:
      type: object
      description: 通道配置（请求视图；敏感字段留空/缺省表示「不修改」）。
      additionalProperties: { type: string }

    Channel:
      type: object
      description: 通道实体（响应视图，config 隐藏敏感字段）。
      properties:
        id: { type: integer }
        name: { type: string, minLength: 1, maxLength: 20 }
        type: { $ref: '#/components/schemas/ChannelType' }
        description: { type: [string, 'null'], description: 备注。 }
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/ChannelConfigPublic' }
        created_at: { type: string, format: date-time }
      required: [id, name, type, enabled, config, created_at]
      example: { id: 1, name: my-tg, type: telegram, description: 个人 TG 机器人, enabled: true, config: { secret: '******', account_id: '123456789' }, created_at: '2026-11-02T10:00:00Z' }

    MessageSummary:
      type: object
      description: 消息精简视图（列表用，无正文）。
      properties:
        id: { type: integer }
        uuid: { type: string, minLength: 32, maxLength: 32, description: 唯一 uuid（分享与状态查询键）。 }
        title: { type: [string, 'null'], maxLength: 512 }
        channel_name: { type: string }
        channel_type: { $ref: '#/components/schemas/ChannelType' }
        to: { type: [string, 'null'], maxLength: 256 }
        status: { $ref: '#/components/schemas/MessageStatus' }
        created_at: { type: string, format: date-time }
      required: [id, uuid, channel_name, channel_type, status, created_at]
      example: { id: 101, uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, title: 部署完成, channel_name: my-tg, channel_type: telegram, to: '@all', status: success, created_at: '2026-11-08T14:03:22Z' }

    MessageDelivery:
      type: object
      description: 消息投递明细（群组/多目标时一条消息多条）。
      properties:
        id: { type: integer }
        channel_id: { type: integer }
        channel_name: { type: string }
        status: { type: string, enum: [pending, success, failed], description: 单目标投递状态。 }
        latency_ms: { type: [integer, 'null'], description: 上游耗时毫秒。 }
        error: { type: [string, 'null'], description: 失败原因（上游可读错误）。 }
        created_at: { type: string, format: date-time }
      required: [id, channel_id, channel_name, status, created_at]
      example: { id: 9001, channel_id: 1, channel_name: my-tg, status: success, latency_ms: 318, error: null, created_at: '2026-11-08T14:03:22Z' }

    MessageDetail:
      type: object
      description: 消息详情（含正文与投递明细）。
      properties:
        id: { type: integer }
        uuid: { type: string, minLength: 32, maxLength: 32 }
        title: { type: [string, 'null'], maxLength: 512 }
        description: { type: [string, 'null'] }
        content: { type: [string, 'null'], description: Markdown 源。 }
        url: { type: [string, 'null'], format: uri }
        channel_name: { type: string }
        channel_type: { $ref: '#/components/schemas/ChannelType' }
        to: { type: [string, 'null'], maxLength: 256 }
        render_mode: { $ref: '#/components/schemas/RenderMode' }
        status: { $ref: '#/components/schemas/MessageStatus' }
        created_at: { type: string, format: date-time }
        deliveries:
          type: array
          description: 投递明细（群组分发/广播时多条；单通道一条）。
          items: { $ref: '#/components/schemas/MessageDelivery' }
      required: [id, uuid, channel_name, channel_type, render_mode, status, created_at, deliveries]
      example:
        id: 101
        uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c
        title: 部署完成
        description: 服务已重启
        content: '# 详情…'
        url: 'https://example.com/log'
        channel_name: my-tg
        channel_type: telegram
        to: '@all'
        render_mode: markdown
        status: success
        created_at: '2026-11-08T14:03:22Z'
        deliveries:
          - { id: 9001, channel_id: 1, channel_name: my-tg, status: success, latency_ms: 318, error: null, created_at: '2026-11-08T14:03:22Z' }

    PublicMessageDetail:
      type: object
      description: 消息正文公开视图（按 uuid 分享）。不含 deliveries、ownerId、数值 id、通道与收件人字段；
        content 为原始内容（未消毒），由前端 DOMPurify 清洗后渲染。
      properties:
        uuid: { type: string, minLength: 32, maxLength: 32 }
        title: { type: [string, 'null'], maxLength: 512 }
        description: { type: [string, 'null'] }
        content: { type: [string, 'null'], description: 原始正文（前端负责消毒）。 }
        url: { type: [string, 'null'], format: uri }
        render_mode: { $ref: '#/components/schemas/RenderMode' }
        status: { $ref: '#/components/schemas/MessageStatus' }
        created_at: { type: string, format: date-time }
      required: [uuid, render_mode, status, created_at]
      example:
        uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c
        title: 部署完成
        description: 服务已重启
        content: '# 详情…'
        url: 'https://example.com/log'
        render_mode: markdown
        status: success
        created_at: '2026-11-08T14:03:22Z'

    Webhook:
      type: object
      description: Webhook 实体（由外部事件触发推送的入口）。
      properties:
        id: { type: integer }
        name: { type: string, minLength: 1, maxLength: 20 }
        link: { type: string, minLength: 32, maxLength: 32, description: '服务端生成的不可预测短链（触发路径 /webhook/{link}）。' }
        target_channel: { type: string, maxLength: 20, description: 目标通道名。 }
        enabled: { type: boolean }
        trigger_url: { type: string, format: uri, description: 完整触发 URL（ServerAddress 拼接）。 }
        extract_rule: { $ref: '#/components/schemas/WebhookExtractRule' }
        construct_rule: { $ref: '#/components/schemas/WebhookConstructRule' }
        created_at: { type: string, format: date-time }
      required: [id, name, link, target_channel, enabled, trigger_url, extract_rule, construct_rule, created_at]
      example:
        id: 3
        name: gh-star
        link: 7c9f1d2e3b4a5f60718293a4b5c6d7e8
        target_channel: my-ding
        enabled: true
        trigger_url: 'https://push.example.com/webhook/7c9f1d2e3b4a5f60718293a4b5c6d7e8'
        extract_rule: { repo: repository.full_name, sender: sender.login, stars: repository.stargazers_count }
        construct_rule: { title: '⭐ 新 Star：$repo', description: '$sender 给 $repo 点了 star（共 $stars）', content: '', url: '' }
        created_at: '2026-11-03T08:00:00Z'

    WebhookExtractRule:
      type: object
      description: 提取规则：自定义键 → 请求体 JSON 路径（点号分隔）。
      additionalProperties: { type: string, description: JSON 路径，如 repository.full_name。 }
      example: { repo: repository.full_name, sender: sender.login, stars: repository.stargazers_count }

    WebhookConstructRule:
      type: object
      description: 构造规则：消息字段 → 含 `$键` 引用的模板。
      properties:
        title: { type: string, description: 标题模板，如 '⭐ 新 Star：$repo'。 }
        description: { type: string, description: 描述模板。 }
        content: { type: string, description: 内容模板（Markdown）。 }
        url: { type: string, description: 跳转链接模板。 }
      example: { title: '⭐ 新 Star：$repo', description: '$sender 给 $repo 点了 star（共 $stars）', content: '', url: '' }

    WebhookTriggerPayload:
      type: object
      description: 外部触发的任意 JSON 请求体（供提取规则按 JSON 路径取值）。
      additionalProperties: true
      example:
        action: starred
        repository: { full_name: hope/nectarpush, stargazers_count: 128 }
        sender: { login: someone }

    Option:
      type: object
      description: 系统设置项。
      properties:
        key: { type: string, description: 设置键（如 SystemName/SMTPServer/OAuth2Providers/Notice…）。 }
        value: { type: string, description: 值（敏感项不回显，返回空串并以 configured 标记）。 }
        sensitive: { type: boolean, description: 是否敏感项（键名含 Token/Secret/Password）。 }
        configured: { type: boolean, description: 敏感项是否已配置（非敏感项缺省 true）。 }
      required: [key, value, sensitive]
      example: { key: SMTPToken, value: '', sensitive: true, configured: true }

    # ---------- 通道类型清单 ----------

    ConfigFieldType:
      type: string
      description: 动态表单控件类型。
      enum: [string, password, number, boolean, select, multiselect, textarea]
      example: password

    ConfigField:
      type: object
      description: 动态表单字段描述（前端按此渲染输入控件）。
      properties:
        key: { type: string, description: 配置键（存入 channel.config）。 }
        label: { type: string, description: 中文标签。 }
        type: { $ref: '#/components/schemas/ConfigFieldType' }
        required: { type: boolean, default: false }
        secret: { type: boolean, description: 敏感字段（密码框 + 不返回明文 + 写入数据库前加密）。 }
        placeholder: { type: [string, 'null'] }
        help: { type: [string, 'null'], description: 辅助说明。 }
        default: { type: [string, 'null'] }
        options:
          type: [array, 'null']
          description: select/multiselect 的可选值。
          items: { type: string }
          example: [plugin, app]
      required: [key, label, type, required, secret]
      example: { key: secret, label: Bot Token, type: password, required: true, secret: true, placeholder: '123456:AAH…' }

    ChannelConfigSchema:
      type: object
      description: 该通道类型的配置表单 schema（fields 数组驱动动态表单；type=none 时 fields 为空数组）。
      properties:
        fields:
          type: array
          items: { $ref: '#/components/schemas/ConfigField' }
      required: [fields]
      example:
        fields:
          - { key: secret, label: Bot Token, type: password, required: true, secret: true }
          - { key: account_id, label: Chat ID, type: string, required: true, secret: false }

    ChannelCapabilities:
      type: object
      description: 通道能力标记（驱动前端字段显隐与 to 文案；group 继承子通道）。
      properties:
        title: { type: boolean }
        description: { type: boolean }
        content: { type: boolean }
        url: { type: boolean }
        to: { type: boolean }
        markdown: { type: boolean }
        to_mode:
          type: string
          description: to 字段语义：recipient=收件人 / @mention=@成员 / chat=会话目标 / none=无 to。
          enum: [recipient, '@mention', chat, none]
      required: [title, description, content, url, to, markdown, to_mode]
      example: { title: true, description: true, content: true, url: true, to: true, markdown: true, to_mode: '@mention' }

    ChannelTypeDescriptor:
      type: object
      description: 通道类型描述（清单条目）。
      properties:
        type: { $ref: '#/components/schemas/ChannelType' }
        display_name: { type: string, description: 中文名。 }
        status: { type: string, enum: [core, draft], description: core=完整实现；draft=占位（还没接入真实服务）。 }
        capabilities: { $ref: '#/components/schemas/ChannelCapabilities' }
        config_schema: { $ref: '#/components/schemas/ChannelConfigSchema' }
      required: [type, display_name, status, capabilities, config_schema]
      example:
        type: telegram
        display_name: Telegram
        status: core
        capabilities: { title: false, description: true, content: true, url: false, to: true, markdown: false, to_mode: chat }
        config_schema:
          fields:
            - { key: secret, label: Bot Token, type: password, required: true, secret: true }
            - { key: account_id, label: Chat ID, type: string, required: true, secret: false }

    # ---------- 请求体 ----------

    PushRequestBody:
      type: object
      description: 推送请求字段（GET 等价 query；别名 short/desp/openid 亦支持）。
      properties:
        title: { type: string, maxLength: 512 }
        description: { type: string }
        short: { type: string, description: description 兼容别名。 }
        content: { type: string }
        desp: { type: string, description: content 兼容别名。 }
        url: { type: string, format: uri }
        channel: { type: string, maxLength: 20 }
        token: { type: string, description: 推送令牌（两种令牌的说明见端点）。 }
        to: { type: string, maxLength: 256, description: '通道选择器（@all / a|b / 通道名）；目标通道为 email 且值为邮箱地址时作为收件人（发他人须授权）。' }
        openid: { type: string, description: to 兼容别名。 }
        async: { type: string, enum: ['true', 'false'], description: '"true" 时异步。' }
        render_mode: { $ref: '#/components/schemas/RenderMode' }
      example: { title: 构建失败, description: main 分支构建失败, channel: ding, token: d1c0ffee1234567890abcdef12345678, to: '@all', async: 'true' }

    ConsoleSendRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string, maxLength: 20, description: 目标通道名。 }
        title: { type: string, maxLength: 512 }
        description: { type: string }
        content: { type: string }
        url: { type: string, format: uri }
        to: { type: string, maxLength: 256 }
        render_mode: { $ref: '#/components/schemas/RenderMode' }
        async: { type: boolean, default: false }
      example: { channel: my-tg, title: 构建失败, content: '# 日志\nexit 1', to: '@all', render_mode: markdown, async: false }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 12 }
        password: { type: string, minLength: 8, maxLength: 20 }
        display_name: { type: string, maxLength: 20 }
        email: { type: string, format: email, maxLength: 50 }
        verification_code: { type: string, description: 开启邮箱验证时必填。 }
        turnstile_token: { type: string, description: 开启 Turnstile 时必填。 }
      example: { username: hope, password: 'h0pe!pass42', display_name: Hope, email: hope@example.com, verification_code: '884213' }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 12 }
        password: { type: string, minLength: 8, maxLength: 20 }
      example: { username: hope, password: 'h0pe!pass42' }

    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 50 }
        turnstile_token: { type: string }
      example: { email: hope@example.com }

    ResetConfirmRequest:
      type: object
      required: [email, token, new_password, new_password_confirm]
      properties:
        email: { type: string, format: email }
        token: { type: string, description: 重置邮件中的一次性令牌。 }
        new_password: { type: string, minLength: 8, maxLength: 20, description: 用户自设的新密码（强度对齐注册）。 }
        new_password_confirm: { type: string, minLength: 8, maxLength: 20, description: 确认新密码，须与 new_password 一致。 }
      example: { email: hope@example.com, token: 5c1f9a77b2e34d08, new_password: my-new-pass-42, new_password_confirm: my-new-pass-42 }

    ChannelUpsertRequest:
      type: object
      required: [type, name]
      properties:
        type: { $ref: '#/components/schemas/ChannelType' }
        name: { type: string, minLength: 1, maxLength: 20, description: 不可为保留名 email。 }
        description: { type: string, maxLength: 100 }
        enabled: { type: boolean, default: true }
        config: { $ref: '#/components/schemas/ChannelConfigInput' }
        token: { type: [string, 'null'], description: 可选通道级推送令牌。 }
      example: { type: telegram, name: my-tg, config: { secret: '7312345678:AAH...', account_id: '123456789' } }

    ChannelUpdateRequest:
      type: object
      properties:
        status_only: { type: boolean, default: false, description: true 时仅更新 enabled。 }
        name: { type: string, minLength: 1, maxLength: 20 }
        description: { type: string, maxLength: 100 }
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/ChannelConfigInput' }
        token: { type: [string, 'null'] }
      example: { status_only: false, enabled: true, config: { account_id: '987654321' } }

    ChannelTestRequest:
      type: object
      properties:
        to: { type: string, maxLength: 256, description: 可选测试目标；缺省用通道默认目标；email 可临时指定收件人。 }
      example: { to: someone@example.com }

    WebhookUpsertRequest:
      type: object
      required: [name, target_channel, extract_rule, construct_rule]
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        target_channel: { type: string, maxLength: 20 }
        enabled: { type: boolean, default: true }
        extract_rule: { $ref: '#/components/schemas/WebhookExtractRule' }
        construct_rule: { $ref: '#/components/schemas/WebhookConstructRule' }
      example:
        name: gh-star
        target_channel: my-ding
        extract_rule: { repo: repository.full_name, sender: sender.login }
        construct_rule: { title: '⭐ $repo', description: '$sender star 了 $repo' }

    WebhookUpdateRequest:
      type: object
      properties:
        status_only: { type: boolean, default: false }
        name: { type: string, minLength: 1, maxLength: 20 }
        target_channel: { type: string, maxLength: 20 }
        enabled: { type: boolean }
        extract_rule: { $ref: '#/components/schemas/WebhookExtractRule' }
        construct_rule: { $ref: '#/components/schemas/WebhookConstructRule' }
      example: { status_only: true, enabled: false }

    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 12 }
        password: { type: string, minLength: 8, maxLength: 20 }
        display_name: { type: string, maxLength: 20 }
        role: { $ref: '#/components/schemas/UserRole' , description: 不可创建 ≥ 自身权限者。 }
      example: { username: alice, password: 'alice!pass99', display_name: Alice, role: user }

    UserUpdateRequest:
      type: object
      description: 允许修改：username / display_name / password。
      properties:
        username: { type: string, maxLength: 12 }
        display_name: { type: string, maxLength: 20 }
        password: { type: string, minLength: 8, maxLength: 20 }
      example: { display_name: Alice2, password: 'new!pass123' }

    UserManageAction:
      type: string
      enum: [enable, disable, promote, demote, allow_send_email_to_others, disallow_send_email_to_others, allow_save_message, disallow_save_message]
      example: allow_save_message

    UserManageRequest:
      type: object
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/UserManageAction' }
      example: { action: allow_save_message }

    UserRestoreRequest:
      type: object
      description: 恢复软删用户。username 可选：缺省沿用存储名（deleted_{id}，被占用时服务端自动生成 restored_{id}_{n}）。
      properties:
        username: { type: string, minLength: 1, maxLength: 12, description: 恢复后使用的用户名；被占用返回 422 DUPLICATE_NAME。 }
      example: { username: hope }

    MessageUpdateRequest:
      type: object
      description: 编辑消息。字段可选，仅更新提供的字段；仅 status 为 pending/failed 的消息可编辑。
      properties:
        title: { type: string, maxLength: 512 }
        description: { type: string }
        content: { type: string }
        url: { type: string, format: uri }
        render_mode: { $ref: '#/components/schemas/RenderMode' }
      example: { title: '部署完成（更新）', content: '# 修订后的日志' }

    OptionUpdateRequest:
      type: object
      required: [key, value]
      properties:
        key: { type: string, maxLength: 64 }
        value: { type: string, description: 值一律字符串（布尔/JSON 序列化后存）。 }
      example: { key: Notice, value: '欢迎使用蜂鸟推送' }

    MeUpdateRequest:
      type: object
      description: |
        允许修改的字段。改密码需带 old_password（OAuth 首次设置密码可省略）；修改邮箱时若已配置
        SMTP，须先调用 `/api/me/email/verification` 并携带 email_code；未配置 SMTP 可直接保存，
        但该邮箱暂时无法用于找回密码。邮箱传空串或 null 表示清除绑定并停用 email 通道。
      properties:
        username: { type: string, maxLength: 12 }
        display_name: { type: string, maxLength: 20 }
        old_password: { type: string, description: 修改密码时必填（账号已有密码时）。 }
        password: { type: string, minLength: 8, maxLength: 20 }
        default_channel: { type: [string, 'null'], maxLength: 20 }
        email: { type: [string, 'null'], format: email, maxLength: 254, description: 新邮箱；空串/null 清除。 }
        email_code: { type: string, minLength: 6, maxLength: 6, description: 已配置 SMTP 时必填的 6 位验证码。 }
      example: { display_name: Hope2, email: hope@example.com, email_code: '482913' }

    PushSettingsUpdateRequest:
      type: object
      properties:
        default_channel: { type: [string, 'null'], maxLength: 20 }
      example: { default_channel: my-ding }

    # ---------- 结果响应格式（Result&lt;T&gt; 具体化） ----------

    PushResultData:
      type: object
      properties:
        uuid: { type: string, minLength: 4, maxLength: 32, description: 消息 uuid；未持久化时为 "unsaved"。 }
      required: [uuid]
      example: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c }

    PushResultEnvelope:
      type: object
      description: 推送结果响应格式（success 表示业务成败）。
      properties:
        success: { type: boolean }
        message: { type: string, description: 失败原因或空串。 }
        data: { $ref: '#/components/schemas/PushResultData' }
      required: [success, message]
      example: { success: true, message: '', data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c } }

    SendResultData:
      type: object
      properties:
        uuid: { type: string }
        status: { $ref: '#/components/schemas/MessageStatus' }
      required: [uuid, status]
      example: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, status: success }

    SendResultEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/SendResultData' }
      required: [success, data]
      example: { success: true, message: 发送成功, data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, status: success } }

    LoginResultData:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        must_change_password: { type: boolean, description: root 首次登录或重置密码后必须改密（未改密前服务端拦截）。 }
      required: [user, must_change_password]
      example:
        user: { id: 1, username: root, display_name: root, role: root, status: active, email: null, default_channel: null, permissions: { send_email_to_others: true, save_message: true }, created_at: '2026-11-01T00:00:00Z' }
        must_change_password: true

    LoginResultEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/LoginResultData' }
      required: [success, data]
      example:
        success: true
        data:
          user: { id: 1, username: root, display_name: root, role: root, status: active, email: null, default_channel: null, permissions: { send_email_to_others: true, save_message: true }, created_at: '2026-11-01T00:00:00Z' }
          must_change_password: true

    ResetConfirmResultEnvelope:
      type: object
      description: 重置成功信封；不含 data，绝不返回明文密码。
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
      required: [success, message]
      example: { success: true, message: 密码已重置 }

    TokenResultData:
      type: object
      properties:
        token: { type: string, description: 新全局令牌（去掉连字符的 UUID；仅本次完整返回）。 }
      required: [token]
      example: { token: e5f60718293a4b5c6d7e8f9a0b1c2d34 }

    TokenResultEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/TokenResultData' }
      required: [success, data]
      example: { success: true, message: 令牌已生成, data: { token: e5f60718293a4b5c6d7e8f9a0b1c2d34 } }

    ChannelTestResultData:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string, description: 结果摘要（成功/失败原因）。 }
        latency_ms: { type: [integer, 'null'] }
        raw: { type: [string, 'null'], description: 上游原始响应（排障用）。 }
      required: [success, message]
      example: { success: true, message: 发送成功, latency_ms: 342, raw: 'telegram sendMessage ok' }

    ChannelTestResultEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/ChannelTestResultData' }
      required: [success, data]
      example:
        success: true
        data: { success: true, message: 发送成功, latency_ms: 342, raw: 'telegram sendMessage ok' }

    MessageStatusData:
      type: object
      properties:
        uuid: { type: string }
        status: { $ref: '#/components/schemas/MessageStatus' }
      required: [uuid, status]
      example: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, status: success }

    MessageStatusEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/MessageStatusData' }
      required: [success, data]
      example: { success: true, message: '', data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, status: success } }

    # ---------- 列表/分页响应格式 ----------

    ChannelListData:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        page: { $ref: '#/components/schemas/PageMeta' }
      required: [items, page]

    ChannelListEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/ChannelListData' }
      required: [success, data]

    ChannelCreated:
      allOf:
        - $ref: '#/components/schemas/Channel'
        - type: object
          properties:
            access_token: { type: [string, 'null'], description: 通道级令牌明文；仅创建响应返回一次（未设置时为 null）。 }
      description: 创建通道的响应视图（在 Channel 基础上多一次性 access_token）。
      example: { id: 1, name: my-tg, type: telegram, enabled: true, config: { secret: '******', account_id: '123456789' }, created_at: '2026-11-02T10:00:00Z', access_token: null }

    ChannelCreatedEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/ChannelCreated' }
      required: [success, data]

    ChannelTokenRequest:
      type: object
      properties:
        token: { type: [string, 'null'], maxLength: 128, description: 可选的自定义令牌；省略则服务端生成 32 位十六进制值。 }
      example: { token: optional-custom-channel-token }

    ChannelTokenData:
      type: object
      properties:
        access_token: { type: string, description: 通道级令牌明文，仅本次返回。 }
      required: [access_token]
      example: { access_token: 6f1c0f9a2b3d4e5f60718293a4b5c6d7 }

    ChannelTokenEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/ChannelTokenData' }
      required: [success, data]

    ChannelEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/Channel' }
      required: [success, data]

    ChannelTypeListData:
      type: object
      properties:
        items:
          type: array
          description: 全部 16 类通道类型描述。
          items: { $ref: '#/components/schemas/ChannelTypeDescriptor' }
        total: { type: integer, const: 16 }
      required: [items, total]

