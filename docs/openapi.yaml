  /api/users/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [users]
      operationId: restoreUser
      summary: 恢复已注销（软删）用户
      description: |
        撤销软删除：清除 deletedAt 并恢复 active。恢复后该用户没有可用凭据（删除时密码/OAuth 已清空），
        管理员需通过 PATCH /api/users/{id} 重置密码（重置后强制改密）后其才能登录。
        用户名规则：未指定 username 时沿用当前存储名（deleted_{id}）；若该名已被他人注册则自动生成
        restored_{id}_{n} 形式的新用户名；显式指定 username 且被占用返回 422 DUPLICATE_NAME。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRestoreRequest' }
            example: { username: hope }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 恢复成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
              example:
                success: true
                message: 用户已恢复
                data: { id: 2, username: hope, display_name: Hope, role: user, status: active, email: null, default_channel: null, permissions: { send_email_to_others: false, save_message: true }, must_change_password: true, deleted_at: null, created_at: '2026-11-01T09:30:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

