        '200':
          description: 删除成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: Webhook 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhook/{name}:
    post:
      tags: [webhooks]
      operationId: triggerWebhook
      summary: 外部系统触发 Webhook（免令牌）
      description: |
        `name` 为 Webhook 的 32 位不可预测短链 link。服务端按提取规则从请求体 JSON 路径取值，
        替换构造规则模板中的 `$键`，组装 PushMessage 后免推送令牌走推送链路。
        请求体可为任意 JSON。Webhook 不存在→404；未启用→403。
      security: []
      parameters:
        - { name: name, in: path, required: true, description: Webhook link（32 位短链）。, schema: { type: string, minLength: 32, maxLength: 32 }, example: 7c9f1d2e3b4a5f60718293a4b5c6d7e8 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookTriggerPayload' }
            example:
              action: starred
              repository: { full_name: hope/nectarpush, stargazers_count: 128 }
              sender: { login: someone }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 触发结果（返回推送 uuid）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResultEnvelope' }
              example: { success: true, message: '', data: { uuid: 2b3c4d5e6f708192a3b4c5d6e7f80911 } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/users:
    get:
