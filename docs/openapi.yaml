            example: { username: alice, password: 'alice!pass99', display_name: Alice, role: user }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 创建成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
              example:
                success: true
                message: 用户创建成功
                data: { id: 4, username: alice, display_name: Alice, role: user, status: active, email: null, default_channel: null, permissions: { send_email_to_others: false, save_message: true }, created_at: '2026-11-08T15:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/users/{id}:
    parameters:
