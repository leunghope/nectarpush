        `disallow_send_email_to_others` / `allow_save_message` / `disallow_save_message`。
        权限约束：不可操作同级或更高权限的用户；仅 root 可提升他人为 admin；不可禁用/删除 root。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserManageRequest' }
            example: { action: allow_save_message }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 动作生效，返回最新用户快照。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
              example:
                success: true
                message: 操作成功
                data: { id: 4, username: alice, display_name: Alice, role: user, status: active, email: alice@example.com, default_channel: null, permissions: { send_email_to_others: false, save_message: true }, created_at: '2026-11-08T15:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/options:
    get:
      tags: [options]
      operationId: getOptions
      summary: 读取系统设置（root；敏感项不回显）
      description: 返回全部 Option（分组：通用/注册与登录/邮件 SMTP/OAuth2/Turnstile/消息持久化与渲染/展示文案）。键名含 Token/Secret/Password 的敏感项不回显明文（仅返回已配置标记）。
      responses:
        '200':
          description: 设置项列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptionListEnvelope' }
              example:
                success: true
                data:
                  items:
                    - { key: SystemName, value: NectarPush, sensitive: false }
                    - { key: ServerAddress, value: 'https://push.example.com', sensitive: false }
                    - { key: RegisterEnabled, value: 'true', sensitive: false }
                    - { key: SMTPServer, value: smtp.example.com, sensitive: false }
                    - { key: SMTPToken, value: '', sensitive: true, configured: true }
                    - { key: OAuth2Providers, value: '[{"id":"github","authorize_url":"https://github.com/login/oauth/authorize","token_url":"https://github.com/login/oauth/access_token","userinfo_url":"https://api.github.com/user","client_id":"Iv1.xxxx","scope":"read:user","map_username":"login","map_email":"email"}]', sensitive: true, configured: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [options]
      operationId: updateOption
      summary: 更新设置项（root；启用前校验依赖已填）
      description: 单项更新；启用 OAuth2 登录前须已填 ClientId/Secret；启用 Turnstile 前须填 SiteKey/Secret；启用邮箱验证前须 SMTP 可用（依赖缺失返回 422 DEPENDENCY_MISSING）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionUpdateRequest' }
            example: { key: Notice, value: '欢迎使用蜂鸟推送' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 更新成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 设置已保存 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/options/oauth2/discover:
    post:
      tags: [options]
      operationId: discoverOAuth2
      summary: 从 OIDC 发现端点补全 OAuth2 端点（root）
      description: |
        输入 issuer 或完整 `.well-known/openid-configuration` 地址；服务端补全 well-known 后缀并读取
        `authorization_endpoint` / `token_endpoint` / `userinfo_endpoint` / `scopes_supported`。
        返回的是建议值，管理员仍可手改；不会写入任何配置。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthDiscoveryRequest' }
            example: { url: 'https://sso.example.com/application/o/nectarpush' }
      responses:
        '200':
          description: 发现成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthDiscoveryEnvelope' }
              example:
                success: true
                data:
                  issuer: 'https://sso.example.com/application/o/nectarpush/'
                  authorize_url: 'https://sso.example.com/application/o/authorize/'
                  token_url: 'https://sso.example.com/application/o/token/'
                  userinfo_url: 'https://sso.example.com/application/o/userinfo/'
                  scope: 'openid profile email'
                  map_username: sub
                  map_email: email
                  scopes_supported: [openid, email, profile]
                  warnings: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: 上游发现文档不可访问或结构非法（OAUTH_DISCOVERY_FAILED）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

