# NectarPush (蜂鸟推送) API Contract
openapi: 3.1.0

info:
  title: NectarPush API
  version: 1.0.0
  summary: 自托管多渠道消息推送服务
  description: |
    NectarPush（蜂鸟推送）统一的 HTTP 接口定义（以此为准）。

    **通道类型（16 类）**：core 10 类 = `email` / `telegram` / `discord` / `ding`（钉钉群机器人）/
    `lark`（飞书群机器人） / `bark` / `custom` / `client`（WebSocket 客户端） / `group` / `none`；
    另有 6 类占位通道（`status: draft`）：`test`（微信测试号） / `corp_app`（企微应用号） /
    `corp`（企微群机器人） / `lark_app`（飞书自建应用） / `one_bot`（QQ/OneBot 协议，不用 `one_api`） /
    `tencent_alarm`（腾讯云告警）。

    **统一的响应格式**：成功 `{ "success": true, "data": … }`；失败 `{ "success": false, "message": "…", "code": "…" }`。
    HTTP 状态码语义保留（401 鉴权失败 / 403 无权 / 404 不存在 / 422 校验失败 / 429 限流）。

    **鉴权两级**：
    - Web 控制台 API（`/api/**`）：会话 Cookie（`cookieAuth`）或 `Authorization: Bearer <用户全局令牌>`（`bearerAuth`）。
    - 推送出口（`/push/{username}`、`POST /webhook/{name}`）：推送令牌有两种：用户全局令牌或目标通道令牌，
      任一设置即必须匹配；令牌可放 query `?token=`、请求体或 `Authorization: Bearer`。Webhook 触发免令牌。

    **范围声明**：通用 OAuth2 授权码登录（GitHub 预设 + 自定义 Provider），不做微信 OAuth；不做附件/文件上传；
    用户注销为软删除并匿名化；首次启动内置 `root/123456`，root 首次登录强制改密（`mustChangePassword`）。

    **强制改密**：`mustChangePassword=true` 的会话访问除 `PATCH /api/me`（自助改密）与
    `POST /api/auth/logout`（登出）以外的受保护接口（`/api/**` 会话鉴权路由）一律返回
    `403 PASSWORD_CHANGE_REQUIRED`；改密成功后自动恢复。

    **异步与实时**：`async=true` 立即返回 `uuid`，经 `GET /api/messages/{uuid}/status`（公开）查询；
    消息正文分享经 `GET /api/messages/{uuid}`（公开，不含 deliveries 与 ownerId，正文为原始内容由前端 DOMPurify 清洗）；
    SSE `GET /api/events`（事件 `message.created` / `delivery.updated`，仅推送本人消息的事件，按 userId 隔离）；
    WebSocket 客户端通道 `GET /ws/client`（协议见 docs/API.md）。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:3000
    description: 本地开发

tags:
  - name: push
    description: 对外统一推送出口（GET|POST /push/{username}）与版本化别名。
  - name: auth
    description: 注册、登录、登出、找回/重置密码、邮箱验证码与通用 OAuth2 授权登录。
  - name: channels
    description: 通道增删改查、测试发送与通道类型清单（驱动前端动态表单）。
  - name: messages
    description: 消息列表/详情/发送/编辑（pending/failed）/重发/删除、异步状态查询与公开正文分享。
  - name: webhooks
    description: Webhook 增删改查与外部触发入口（由外部事件触发推送）。
  - name: users
    description: 管理员用户管理（含角色层级约束、用户动作与软删恢复）。
  - name: options
    description: 系统设置（admin/root 读写，敏感项不返回明文）。
  - name: me
    description: 当前用户资料、令牌与推送设置。
  - name: realtime
    description: SSE 事件流（/api/events，事件按登录用户隔离）。WebSocket 客户端通道 /ws/client 为升级端点，不属 REST，协议（握手鉴权、旧连接被断开、ping/pong、下行帧）以说明形式登记于本节与 docs/API.md「WebSocket 客户端通道」。
  - name: public
    description: 公开信息（关于、公告、页脚、Turnstile SiteKey、健康检查、版本）。

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /push/{username}:
    get:
      tags: [push]
      operationId: pushGet
      summary: 以查询参数推送（Server酱风格）
      description: |
        以 GET query 推送一条消息到 `{username}` 的指定（或默认）通道。
        令牌有两种：用户全局令牌或目标通道令牌，任一设置即必须匹配；令牌可放 query `token` 或 `Authorization: Bearer`。
        字段别名：`short`→`description`、`desp`→`content`、`openid`→`to`。
        `to=@all` 广播全部启用通道；`to=a|b` 多目标。`async=true` 需消息持久化权限。
        **收件人语义**：当目标通道（`channel` 参数→用户默认通道→`email`）解析为
        **email 通道**且 `to` 为邮箱地址时，`to` 作为**收件人**（overrideTo），通道选择即该 email 通道；
        其余情况 `to` 保持通道选择器语义。向**非本人绑定邮箱**发信须用户具备
        `allowSendEmailToOthers` 授权（管理员经用户管理授予），否则发送前拒绝 403 `FORBIDDEN`；
        获授权者向他人发信另受更严限流（每用户 10 次/3 分钟，超出 429 `RATE_LIMITED`），
        且服务端审计日志记录发送者/收件人/通道/时间。
      security:
        - bearerAuth: []
        - pushTokenQuery: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - { name: title, in: query, description: 标题；缺省用系统名。, schema: { type: string, maxLength: 512 }, example: 部署完成 }
        - { name: description, in: query, description: 描述/纯文本正文；别名 short。, schema: { type: string }, example: 服务已重启 }
        - { name: short, in: query, description: description 的兼容别名（description 为空时生效）。, schema: { type: string } }
        - { name: content, in: query, description: 长文/Markdown 源；别名 desp。, schema: { type: string }, example: '# 详情…' }
        - { name: desp, in: query, description: content 的兼容别名（content 为空时生效）。, schema: { type: string } }
        - { name: url, in: query, description: 点击跳转链接。, schema: { type: string, format: uri }, example: 'https://example.com/log' }
        - { name: channel, in: query, description: 目标通道名；缺省用户默认通道，再缺省 email。, schema: { type: string, maxLength: 20 }, example: telegram }
        - { name: token, in: query, description: 鉴权令牌（两种令牌的用法见端点说明）。, schema: { type: string }, example: d1c0ffee1234567890abcdef12345678 }
        - { name: to, in: query, description: '通道选择器：@all 广播 / a|b 多目标 / 通道名；别名 openid。特例：目标通道为 email 且值为邮箱地址时作为收件人，发他人邮箱须 allowSendEmailToOthers 授权（否则 403）。', schema: { type: string, maxLength: 256 }, example: '@all' }
        - { name: openid, in: query, description: to 的兼容别名（to 为空时生效）。, schema: { type: string } }
        - { name: async, in: query, description: 为字符串 "true" 时异步发送（立即返回 uuid）。, schema: { type: string, enum: ['true', 'false'] }, example: 'false' }
        - { name: render_mode, in: query, description: 渲染模式，缺省 markdown。, schema: { $ref: '#/components/schemas/RenderMode' }, example: markdown }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 推送结果（响应里的 success 表示业务成败；鉴权失败为 401）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResultEnvelope' }
              example:
                success: true
                message: ''
                data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [push]
      operationId: pushPost
      summary: 以 JSON 或表单体推送
      description: |
        以 `application/json` 或 `application/x-www-form-urlencoded` 推送。
        body 缺 `token` 时可从 query `?token=` 补。字段语义与别名同 GET。
      security:
        - bearerAuth: []
        - pushTokenQuery: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - { name: token, in: query, description: body 缺 token 时可从 query 补。, schema: { type: string } }
        - { name: async, in: query, description: body 缺 async 时可从 query 补（"true" 生效）。, schema: { type: string, enum: ['true', 'false'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequestBody' }
            example:
              title: 构建失败
              description: main 分支构建失败
              content: '# 构建日志\n```text\nexit 1\n```'
              url: 'https://ci.example.com/run/1024'
              channel: ding
              token: d1c0ffee1234567890abcdef12345678
              to: '@all'
              async: 'true'
              render_mode: markdown
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PushRequestBody' }
            example:
              title: 构建失败
              desp: '# 构建日志'
              openid: '@all'
              token: d1c0ffee1234567890abcdef12345678
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 推送结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResultEnvelope' }
              example:
                success: true
                message: ''
                data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/push/{username}:
    post:
      tags: [push]
      operationId: pushPostV1
      summary: 版本化推送别名（等价 POST /push/{username}）
      description: 行为与 `POST /push/{username}` 完全一致，仅路径版本化。
      security:
        - bearerAuth: []
        - pushTokenQuery: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - { name: token, in: query, description: body 缺 token 时可从 query 补。, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequestBody' }
            example: { title: 别名路径, description: v1, channel: none }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 推送结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResultEnvelope' }
              example: { success: true, message: '', data: { uuid: 0a1b2c3d4e5f60718293a4b5c6d7e8f9 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 用户名密码注册
      description: 受「允许注册/允许密码注册/邮箱验证」开关与 Turnstile、临界限流约束。用户名 ≤12 唯一；密码 8–20 位。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              username: hope
              password: 'h0pe!pass42'
              display_name: Hope
              email: hope@example.com
              verification_code: '884213'
              turnstile_token: XXX.DUMMY.TOKEN
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 注册结果（失败也返回 200 的响应格式或 422，见错误码）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 注册成功 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 密码登录（建立会话 Cookie）
      description: 成功后设置 HttpOnly 会话 Cookie 并返回精简用户信息；root 首次登录返回 `mustChangePassword=true`（未改密前前端会强制跳转到改密页）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: hope, password: 'h0pe!pass42' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 登录成功；Set-Cookie 会话。
          headers:
            Set-Cookie:
              description: 会话 Cookie（HttpOnly；SameSite=Lax）。
              schema: { type: string, example: np_session=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResultEnvelope' }
              example:
                success: true
                data:
                  user:
                    id: 2
                    username: hope
                    display_name: Hope
                    role: user
                    status: active
                    email: hope@example.com
                    default_channel: email
                    permissions: { send_email_to_others: false, save_message: true }
                    created_at: '2026-11-01T09:30:00Z'
                  must_change_password: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出并清除会话
      description: 可重复调用：未登录调用同样返回 200（无会话可清）并清除可能存在的 Cookie。
      security: []
      responses:
        '200':
          description: 登出成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 已登出 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/verification:
    post:
      tags: [auth]
      operationId: sendVerificationCode
      summary: 发送邮箱验证码（注册/绑定用）
      description: 临界限流 + 可选 Turnstile；验证码有有效期。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
            example: { email: hope@example.com, turnstile_token: XXX.DUMMY.TOKEN }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 发送结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 验证码已发送 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/reset-request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 请求找回密码邮件
      description: 向邮箱发送含一次性 token 的重置链接；未注册邮箱不泄露存在性（统一提示）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
            example: { email: hope@example.com }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 统一成功提示。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 若邮箱已注册，重置邮件已发送 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/reset-confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: 凭邮件 token 重置密码（用户自设新密码）
      description: 校验通过后设置用户自设的新密码（强度对齐注册 8–20 位，两次输入须一致）；响应只回成功、不返回任何明文密码；旧密码与旧会话失效，token 一次性。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetConfirmRequest' }
            example: { email: hope@example.com, token: 5c1f9a77b2e34d08, new_password: my-new-pass-42, new_password_confirm: my-new-pass-42 }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 重置成功（不返回明文密码）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetConfirmResultEnvelope' }
              example:
                success: true
                message: 密码已重置
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/oauth/providers:
    get:
      tags: [auth]
      operationId: listOAuthProviders
      summary: 可用的 OAuth2 登录提供方（公开）
      description: 仅返回 id 与显示名，供登录页动态渲染第三方登录按钮；不暴露 client_id/secret。
      security: []
      responses:
        '200':
          description: 提供方列表；未配置时为空数组。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProviderListEnvelope' }
              example:
                success: true
                data:
                  items:
                    - { id: github, display_name: GitHub }
                    - { id: authentik, display_name: Leunghope SSO }

  /api/auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: oauthStart
      summary: 发起 OAuth2 授权码跳转
      description: |
        302 跳转到 Provider 授权页。`provider` 取值：内置预设 `github`，或管理员配置的自定义 Provider 标识（Option `OAuth2Providers`）。
        未配置/未启用的 Provider 返回 403。**不做微信 OAuth**。
      security: []
      parameters:
        - { name: provider, in: path, required: true, description: Provider 标识（github 或自定义）。, schema: { type: string, maxLength: 32 }, example: github }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '302':
          description: 重定向到 Provider 授权页。
          headers:
            Location:
              description: Provider 授权 URL。
              schema: { type: string, format: uri, example: 'https://github.com/login/oauth/authorize?client_id=...&state=...' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      summary: 通用 OAuth2 授权码回调
      description: |
        用 `code` 换 token、拉取 userinfo、按字段映射建立或绑定账号并创建会话；首次授权可自动建号。
        成功 302 到前端工作台（Set-Cookie），失败 302 到前端错误页（带 `?error=`）。
      security: []
      parameters:
        - { name: provider, in: path, required: true, description: Provider 标识。, schema: { type: string, maxLength: 32 }, example: github }
        - { name: code, in: query, required: true, description: 授权码。, schema: { type: string }, example: a1b2c3d4e5 }
        - { name: state, in: query, required: true, description: 防 CSRF 回传 state。, schema: { type: string }, example: f0e1d2c3 }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '302':
          description: 登录成功跳转（Set-Cookie）或失败跳转（Location 含 error 参数）。
          headers:
            Location:
              description: 前端跳转地址。
              schema: { type: string, format: uri, example: 'https://push.example.com/?oauth=ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: 自己的通道列表（支持搜索与精简模式）
      parameters:
        - { name: keyword, in: query, description: 按名称/备注搜索。, schema: { type: string, maxLength: 64 }, example: tg }
        - { name: brief, in: query, description: true 时仅返回 id/name/type/enabled。, schema: { type: boolean }, example: false }
      responses:
        '200':
          description: 通道列表（config 中敏感字段显示为 `******`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelListEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: 1
                      name: my-tg
                      type: telegram
                      enabled: true
                      description: 个人 TG 机器人
                      config: { secret: '******', account_id: '123456789' }
                      created_at: '2026-11-02T10:00:00Z'
                  page: { page: 1, page_size: 20, total: 1, total_pages: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [channels]
      operationId: createChannel
      summary: 新建通道
      description: 名称 1–20 且本人唯一；保留名 `email` 不可手动创建（由绑定邮箱自动生成）。config 敏感项加密存储。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelUpsertRequest' }
            example:
              type: telegram
              name: my-tg
              description: 个人 TG 机器人
              enabled: true
              config: { secret: '7312345678:AAH...', account_id: '123456789' }
              token: optional-channel-level-push-token
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 创建成功。若请求带了通道级令牌，`access_token` 仅在本响应中明文返回一次。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCreatedEnvelope' }
              example:
                success: true
                message: 通道创建成功
                data: { id: 1, name: my-tg, type: telegram, enabled: true, config: { secret: '******', account_id: '123456789' }, created_at: '2026-11-02T10:00:00Z', access_token: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/channels/types:
    get:
      tags: [channels]
      operationId: listChannelTypes
      summary: 通道类型清单（16 类 configSchema + capabilities）
      description: |
        返回全部 16 类通道类型的 `configSchema`（驱动前端动态表单：fields 数组含 key/label/type/required/secret 等）
        与 `capabilities`（title/description/content/url/to/markdown 布尔位 + `toMode` recipient|@mention|chat|none 驱动 to 字段文案与校验）。
        另有 6 类占位通道 `status: draft`。前端据此渲染表单并按能力标记显隐字段。
      responses:
        '200':
          description: 16 类通道类型描述。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTypeListEnvelope' }
              example:
                success: true
                data:
                  total: 16
                  items:
                    - type: email
                      display_name: 邮件
                      status: core
                      capabilities: { title: true, description: true, content: true, url: false, to: true, markdown: false, to_mode: recipient }
                      config_schema:
                        fields:
                          - { key: account_id, label: 默认收件人, type: string, required: false, secret: false, help: 留空时发往账号绑定邮箱 }
                    - type: telegram
                      display_name: Telegram
                      status: core
                      capabilities: { title: false, description: true, content: true, url: false, to: true, markdown: false, to_mode: chat }
                      config_schema:
                        fields:
                          - { key: secret, label: Bot Token, type: password, required: true, secret: true }
                          - { key: account_id, label: Chat ID, type: string, required: true, secret: false }
                    - type: ding
                      display_name: 钉钉群机器人
                      status: core
                      capabilities: { title: true, description: true, content: true, url: true, to: true, markdown: true, to_mode: '@mention' }
                      config_schema:
                        fields:
                          - { key: url, label: Webhook 地址, type: string, required: true, secret: false }
                          - { key: secret, label: 加签密钥, type: password, required: true, secret: true }
                    - type: one_bot
                      display_name: QQ(OneBot)
                      status: draft
                      capabilities: { title: false, description: true, content: true, url: false, to: true, markdown: false, to_mode: chat }
                      config_schema:
                        fields:
                          - { key: url, label: 服务器地址, type: string, required: true, secret: false }
                          - { key: secret, label: Access Token, type: password, required: true, secret: true }
                          - { key: account_id, label: 默认目标(QQ号), type: string, required: false, secret: false }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/channels/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [channels]
      operationId: getChannel
      summary: 通道详情（敏感字段隐藏）
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 通道详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelEnvelope' }
              example:
                success: true
                data: { id: 1, name: my-tg, type: telegram, enabled: true, description: 个人 TG 机器人, config: { secret: '******', account_id: '123456789' }, created_at: '2026-11-02T10:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [channels]
      operationId: updateChannel
      summary: 编辑通道（或仅切换启停 status_only）
      description: '`status_only=true` 时仅更新 enabled，不改其它字段；config 中敏感字段传空/缺省表示不修改。'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelUpdateRequest' }
            example:
              status_only: false
              enabled: true
              description: 更新后的备注
              config: { account_id: '987654321' }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 更新成功（返回隐藏敏感字段后的通道）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelEnvelope' }
              example: { success: true, message: 通道已更新, data: { id: 1, name: my-tg, type: telegram, enabled: true, config: { secret: '******', account_id: '987654321' }, created_at: '2026-11-02T10:00:00Z' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [channels]
      operationId: deleteChannel
      summary: 删除通道（同步清理令牌缓存）
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 删除成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 通道已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/channels/{id}/test:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [channels]
      operationId: testChannel
      summary: 通道测试发送
      description: 发送一条测试消息并回显结果。默认使用通道默认目标；email 通道可临时指定 `to`。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelTestRequest' }
            example: { to: someone@example.com }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 测试结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTestResultEnvelope' }
              example:
                success: true
                data: { success: true, message: 发送成功, latency_ms: 342, raw: 'telegram sendMessage ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/channels/{id}/token:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [channels]
      operationId: rotateChannelToken
      summary: 重新生成（或设置）通道级推送令牌
      description: |
        通道级令牌的轮换入口。返回的 `access_token` 只出现一次；
        写入后旧令牌立即失效（推送侧只比对当前密文）。省略 body 或 `token` 时生成新的 32 位十六进制令牌。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelTokenRequest' }
            example: { token: optional-custom-channel-token }
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 新的通道级令牌（仅本次明文）。 
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelTokenEnvelope' }
              example: { success: true, message: '', data: { access_token: 6f1c0f9a2b3d4e5f60718293a4b5c6d7 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: 自己的消息列表（分页 + 状态/通道/时间筛选 + 搜索）
      description: 列表仅返回精简字段（无正文）；按时间倒序。筛选变化重置到第 1 页（前端行为）。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: keyword, in: query, description: 按标题/内容搜索。, schema: { type: string, maxLength: 64 }, example: 构建 }
        - { name: status, in: query, description: 状态筛选。, schema: { $ref: '#/components/schemas/MessageStatus' } }
        - { name: channel, in: query, description: 通道名筛选。, schema: { type: string, maxLength: 20 }, example: telegram }
        - { name: since, in: query, description: 起始时间（ISO 8601，含）。, schema: { type: string, format: date-time }, example: '2026-11-01T00:00:00Z' }
        - { name: until, in: query, description: 截止时间（ISO 8601，含）。, schema: { type: string, format: date-time }, example: '2026-11-08T23:59:59Z' }
      responses:
        '200':
          description: 消息分页列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePageEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: 101
                      uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c
                      title: 部署完成
                      channel_name: my-tg
                      channel_type: telegram
                      to: '@all'
                      status: success
                      created_at: '2026-11-08T14:03:22Z'
                  page: { page: 1, page_size: 10, total: 42, total_pages: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [messages]
      operationId: sendMessage
      summary: 控制台发送消息
      description: 登录用户从控制台发送（走与 /push 相同链路，免推送令牌）；支持 async（需持久化权限）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleSendRequest' }
            example:
              channel: my-tg
              title: 构建失败
              content: '# 日志\nexit 1'
              url: 'https://ci.example.com/run/1024'
              to: '@all'
              render_mode: markdown
              async: false
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 发送结果（含 uuid 与状态）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendResultEnvelope' }
              example:
                success: true
                message: 发送成功
                data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, status: success }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [messages]
      operationId: clearAllMessages
      summary: 清空消息（scope=own 本人；scope=all 全部用户·仅 root）
      description: |
        硬删除且不可撤销，前端须二次确认。
        - `scope=own`（默认）：仅删除调用者本人的全部消息，所有已登录用户可用；
        - `scope=all`：删除**全部用户**的消息（投递明细 MessageDelivery 级联删除），
          仅超级管理员（root）可用；非 root 调用返回 403 FORBIDDEN。
        注意：root **账号**不可被删除/禁用（用户管理侧保护），与清空消息是两回事。
      parameters:
        - name: scope
          in: query
          description: 清空范围：own=仅本人（默认）；all=全部用户（仅 root）。
          schema: { type: string, enum: [own, all], default: own }
      responses:
        '200':
          description: 清空成功。scope=own 返回「已清空全部消息」；scope=all 返回「已清空全部用户的消息」。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              examples:
                own: { summary: 清空本人, value: { success: true, message: 已清空全部消息 } }
                all: { summary: 清空全部用户, value: { success: true, message: 已清空全部用户的消息 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/messages/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [messages]
      operationId: getMessage
      summary: 消息详情（含投递明细）
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 消息详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDetailEnvelope' }
              example:
                success: true
                data:
                  id: 101
                  uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c
                  title: 部署完成
                  description: 服务已重启
                  content: '# 详情…'
                  url: 'https://example.com/log'
                  channel_name: my-group
                  channel_type: group
                  to: '@all'
                  render_mode: markdown
                  status: partial
                  created_at: '2026-11-08T14:03:22Z'
                  deliveries:
                    - { id: 9001, channel_id: 1, channel_name: my-tg, status: success, latency_ms: 318, error: null, created_at: '2026-11-08T14:03:22Z' }
                    - { id: 9002, channel_id: 2, channel_name: my-ding, status: failed, latency_ms: 5010, error: 'dial timeout', created_at: '2026-11-08T14:03:27Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [messages]
      operationId: updateMessage
      summary: 编辑自己的消息（仅 pending/failed）
      description: 仅允许编辑待投递（pending）或投递失败（failed）的消息；已成功投递的消息请使用重发。字段均可选，仅更新提供的字段。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageUpdateRequest' }
            example:
              title: 部署完成（更新）
              content: '# 修订后的日志'
              render_mode: markdown
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 编辑成功，返回更新后的消息详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: 删除自己的单条消息
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 删除成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, message: 消息已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [messages]
      operationId: resendMessage
      summary: 重发消息（生成新记录与新 uuid）
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 重发结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendResultEnvelope' }
              example: { success: true, message: 已重发, data: { uuid: 1a2b3c4d5e6f708192a3b4c5d6e7f809, status: success } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{uuid}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    get:
      tags: [messages]
      operationId: getPublicMessage
      summary: 按 uuid 读取消息正文（公开、免鉴权）
      description: 消息正文分享端点。返回只读公开视图：uuid/title/description/content/url/render_mode/status/created_at；
        不含 deliveries、ownerId、数值 id、通道与收件人字段。content 为原始内容（未消毒），由前端 DOMPurify 清洗后渲染。
        注意：与 GET /api/messages/{id} 共用同一路由空间——纯数字路径段按消息 id 处理（需会话鉴权），其余按 uuid 处理。
      security: []
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 公开消息视图。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMessageDetailEnvelope' }
              example:
                success: true
                data:
                  uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c
                  title: 部署完成
                  description: 服务已重启
                  content: '# 详情…'
                  url: 'https://example.com/log'
                  render_mode: markdown
                  status: success
                  created_at: '2026-11-08T14:03:22Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{uuid}/status:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    get:
      tags: [messages]
      operationId: getMessageStatus
      summary: 按 uuid 查询消息状态（公开、免鉴权）
      security: []
      responses:
        '414': { $ref: '#/components/responses/UriTooLong' }
        '200':
          description: 当前状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageStatusEnvelope' }
              example:
                success: true
                message: ''
                data: { uuid: 9f8b2a1c7d6e4f0a3b2c1d0e9f8a7b6c, status: success }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: 自己的 Webhook 列表（含触发 URL）
      parameters:
        - { name: keyword, in: query, description: 按名称搜索。, schema: { type: string, maxLength: 64 }, example: github }
      responses:
        '200':
          description: Webhook 列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookListEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: 3
                      name: gh-star
                      link: 7c9f1d2e3b4a5f60718293a4b5c6d7e8
                      target_channel: my-ding
                      enabled: true
                      trigger_url: 'https://push.example.com/webhook/7c9f1d2e3b4a5f60718293a4b5c6d7e8'
                      extract_rule: { repo: repository.full_name, sender: sender.login, stars: repository.stargazers_count }
                      construct_rule: { title: '⭐ 新 Star：$repo', description: '$sender 给 $repo 点了 star（共 $stars）', content: '', url: '' }
                      created_at: '2026-11-03T08:00:00Z'
                  page: { page: 1, page_size: 20, total: 1, total_pages: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: 新建 Webhook（服务端生成 32 位不可预测短链 link）
      description: 提取规则为「键→请求体 JSON 路径」映射；构造规则为「消息字段→含 `$键` 的模板」。保存时做合法性校验。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookUpsertRequest' }
            example:
              name: gh-star
              target_channel: my-ding
              enabled: true
              extract_rule: { repo: repository.full_name, sender: sender.login, stars: repository.stargazers_count }
              construct_rule: { title: '⭐ 新 Star：$repo', description: '$sender 给 $repo 点了 star（共 $stars）' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 创建成功（含生成的 link 与触发 URL）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEnvelope' }
              example:
                success: true
                message: Webhook 创建成功
                data:
                  id: 3
                  name: gh-star
                  link: 7c9f1d2e3b4a5f60718293a4b5c6d7e8
                  target_channel: my-ding
                  enabled: true
                  trigger_url: 'https://push.example.com/webhook/7c9f1d2e3b4a5f60718293a4b5c6d7e8'
                  extract_rule: { repo: repository.full_name, sender: sender.login, stars: repository.stargazers_count }
                  construct_rule: { title: '⭐ 新 Star：$repo', description: '$sender 给 $repo 点了 star（共 $stars）', content: '', url: '' }
                  created_at: '2026-11-03T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
